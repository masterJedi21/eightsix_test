<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 66" fill="none">
  <defs>
    <filter id="redGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- EIGHT SIX -->
  <text x="0" y="40" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="700" fill="#ffffff" letter-spacing="1">EIGHT SIX</text>

  <!-- Red glowing dot -->
  <circle cx="234" cy="16" r="5.5" fill="#D62828" filter="url(#redGlow)"/>

  <!-- < IT Engineering/> -->
  <text x="2" y="60" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="500" fill="#F4C430">&#60; IT Engineering/&#62;</text>
</svg>
